name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - shell: pwsh
        run: ./scripts/test.ps1
      - shell: pwsh
        run: ./scripts/build.ps1 -OneFile
      - uses: actions/upload-artifact@v4
        with:
          name: Razorbeam-Terraria-AIO-RP-standalone-${{ github.sha }}
          path: .build/standalone/RazorbeamTerrariaPatcher.exe
          if-no-files-found: error
