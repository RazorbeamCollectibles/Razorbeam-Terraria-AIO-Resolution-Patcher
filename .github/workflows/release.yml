name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - shell: pwsh
        run: ./scripts/test.ps1
      - shell: pwsh
        run: ./scripts/build.ps1 -OneFile
      - name: Package release files
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = Join-Path $PWD '.build\release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item '.build\standalone\RazorbeamTerrariaPatcher.exe' (Join-Path $stage 'RazorbeamTerrariaPatcher.exe')
          $sourceArchive = Join-Path $stage "Razorbeam-Terraria-AIO-RP-v$version-source.zip"
          git archive --format=zip "--output=$sourceArchive" HEAD
      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $assets = (Get-ChildItem '.build\release' -File).FullName
          gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "All-in-One Resolution Patcher $env:GITHUB_REF_NAME" --generate-notes $assets
